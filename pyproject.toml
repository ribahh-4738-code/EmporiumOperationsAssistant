[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emporium-operations-assistant"
version = "0.5.0"
description = "Conversational operations assistant for Emporium (Maiara persona)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0",
  "psycopg[binary]>=3.2",
  "chromadb>=1.5.9,<1.6",
  "pypdf>=5.0",
]

[project.scripts]
emporium-chat = "emporium_operations_assistant.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
